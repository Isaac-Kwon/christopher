[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "christopher"
version = "0.1.0"
description = "Project Christopher: Enigma and the Turing-Welchman Bombe"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
manifest-path = "crates/christopher-py/Cargo.toml"
python-source = "python"
module-name = "christopher._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
